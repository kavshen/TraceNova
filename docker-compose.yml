services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tracenova}
      POSTGRES_USER: ${POSTGRES_USER:-tracenova}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tracenova}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
    environment:
      TRACENOVA_ENVIRONMENT: development
      TRACENOVA_LOG_LEVEL: INFO
      TRACENOVA_DATABASE_URL: postgresql+asyncpg://tracenova:tracenova@postgres:5432/tracenova
      TRACENOVA_REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 10

