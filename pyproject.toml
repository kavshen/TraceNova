[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "tracenova"
version = "0.1.0"
description = "Event-driven pipeline reliability and root-cause analysis platform."
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1.0",
  "pydantic-settings>=2.6,<3.0",
  "sqlalchemy[asyncio]>=2.0,<3.0",
  "asyncpg>=0.30,<1.0",
  "redis>=5.2,<7.0",
  "structlog>=24.4,<26.0",
  "uvicorn[standard]>=0.32,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1.0",
  "mypy>=1.13,<2.0",
  "pytest>=8.3,<9.0",
  "ruff>=0.8,<1.0",
]

[tool.setuptools.packages.find]
where = ["services/api/src", "packages/config/src", "packages/logging/src", "packages/common/src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["services/api/src", "packages/config/src", "packages/logging/src", "packages/common/src"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["services", "packages"]
mypy_path = "services/api/src:packages/config/src:packages/logging/src:packages/common/src"
